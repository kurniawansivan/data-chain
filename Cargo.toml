[package]
name = "data-chain"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
ed25519-dalek = { version = "2.1.0", features = ["serde", "rand_core"] }
rand = "0.8"